name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: katia-api
            context: ./backend
          - image: katia-web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            VITE_BUILD_VERSION=${{ github.run_number }}.${{ github.run_attempt }}
            VITE_BUILD_REVISION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
